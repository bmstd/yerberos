<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="shortcut icon" href="./assets/images/brand/favicon.ico" type="image/x-icon">
</head>
<body>
<!-- =========================
    Navbar
========================= -->
<header class="navbar">
    <div class="navbar__container">
        <!-- Marca -->
        <a
            href="./index.html#inicio"
            class="navbar__brand"
            aria-label="YERBEROS - Inicio"
        >
            <img
                src="./assets/images/brand/logo.webp"
                alt=""
                class="navbar__logo"
            >
            <span class="navbar__name">
                Yerberos
            </span>
        </a>
        <!-- Navegación -->
        <nav
            class="navbar__nav"
            id="navbar-nav"
            aria-label="Navegación principal"
        >
            <a
                href="#inicio"
                class="navbar__link"
            >
                Inicio
            </a>
            <a
                href="#destacados"
                class="navbar__link"
            >
                Destacados
            </a>
            <a
                href="#nosotros"
                class="navbar__link"
            >
                Nosotros
            </a>
            <a
                href="#contacto"
                class="navbar__link"
            >
                Contacto
            </a>
        </nav>
        <!-- CTA -->
        <a
            href="./catalogo.html"
            class="navbar__cta"
        >
            Catálogo
        </a>
        <!-- Botón menú mobile -->
        <button
            class="navbar__toggle"
            type="button"
            aria-label="Abrir menú"
            aria-expanded="false"
            aria-controls="navbar-nav"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>
</header>
<script src="./js/main.js"></script>
</body>
</html>
